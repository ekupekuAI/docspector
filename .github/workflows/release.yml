name: Build Desktop Binaries

# Builds self-contained single-file executables (no Python/Node required on
# the target machine) for Windows, Linux, and macOS, and attaches them to
# the GitHub Release when a v* tag is pushed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            built: Docspector.exe
            asset: Docspector-windows-x64.exe
          - os: ubuntu-latest
            built: Docspector
            asset: Docspector-linux-x64
          - os: macos-latest
            built: Docspector
            asset: Docspector-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Build executable
        run: python scripts/build_desktop.py
      - name: Smoke test executable
        shell: bash
        env:
          DOCSPECTOR_NO_BROWSER: "1"
          DOCSPECTOR_PORT: "8777"
          DOCSPECTOR_DATA_DIR: ${{ runner.temp }}/docspector-smoke
        run: |
          "backend/dist/${{ matrix.built }}" &
          APP_PID=$!
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8777/health > /dev/null 2>&1; then
              echo "health endpoint OK"
              curl -fsS http://127.0.0.1:8777/ -o smoke_index.html
              grep -qi "<!doctype html>" smoke_index.html
              echo "bundled UI OK"
              login=$(curl -fsS -X POST -H 'Content-Type: application/json' \
                -d '{"username":"docspector.io"}' http://127.0.0.1:8777/api/v1/auth/login)
              echo "$login" | grep -q access_token
              echo "seeded demo login OK"
              kill $APP_PID
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: executable did not become healthy in time"
          kill $APP_PID || true
          exit 1
      - name: Rename artifact
        shell: bash
        run: cp "backend/dist/${{ matrix.built }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
